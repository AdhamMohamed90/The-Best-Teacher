<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - TutorHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="header">
        <a href="../index.html" class="logo">TutorHub</a>
        <nav>
            <span id="themeToggle"></span>
            <span id="userName"></span>
            <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
        </nav>
    </header>
    <div class="dashboard">
        <aside class="sidebar">
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><span class="icon">📊</span> Dashboard</a></li>
                <li><a href="profile.html" class="active"><span class="icon">👤</span> Profile</a></li>
                <li><a href="subjects.html"><span class="icon">📚</span> Subjects</a></li>
                <li><a href="cities.html"><span class="icon">📍</span> Cities</a></li>
                <li><a href="availability.html"><span class="icon">🕐</span> Availability</a></li>
                <li><a href="groups.html"><span class="icon">👥</span> Groups</a></li>
                <li><a href="bookings.html"><span class="icon">📅</span> Bookings</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <div class="page-header"><h1>My Profile</h1><button class="btn btn-danger btn-sm" onclick="deleteProfile()">Delete Account</button></div>
            <div class="card" style="max-width:600px;">
                <div id="error" class="alert alert-error hidden"></div>
                <div id="success" class="alert alert-success hidden"></div>
                <form id="profileForm">
                    <div class="form-group"><label>Teaching Mode</label><select id="teachingmode" class="form-control"><option value="online">Online</option><option value="offline">Offline</option><option value="both">Both</option></select></div>
                    <div class="form-group"><label>Bio</label><textarea id="bio" class="form-control" rows="4" placeholder="Tell students about yourself..."></textarea></div>
                    <button type="submit" class="btn btn-primary" id="saveBtn">Save Changes</button>
                </form>
            </div>
        </main>
    </div>
    <nav class="mobile-nav"><a href="dashboard.html"><span>📊</span> Home</a><a href="subjects.html"><span>📚</span> Subjects</a><a href="groups.html"><span>👥</span> Groups</a><a href="bookings.html"><span>📅</span> Bookings</a></nav>
    <script src="../js/api.js?v=5"></script>
    <script src="../js/auth.js?v=5"></script>
    <script src="../js/helpers.js?v=5"></script>
    <script src="../js/theme.js?v=5"></script>
    <script src="js/profile.js?v=5"></script>
    <script>createThemeToggle("themeToggle");</script>
</body>
</html>
