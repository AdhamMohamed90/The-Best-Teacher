<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Teacher Profile - TutorHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="header">
        <a href="../index.html" class="logo">TutorHub</a>
        <nav><span id="themeToggle"></span><span id="userName"></span><button class="btn btn-outline btn-sm" onclick="logout()">Logout</button></nav>
    </header>
    <div class="dashboard">
        <aside class="sidebar">
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><span class="icon">📊</span> Dashboard</a></li>
                <li><a href="search.html" class="active"><span class="icon">🔍</span> Find Tutors</a></li>
                <li><a href="bookings.html"><span class="icon">📅</span> My Bookings</a></li>
                <li><a href="groups.html"><span class="icon">👥</span> Groups</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <div id="teacherContent"></div>
            <div id="bookingModal" class="modal-overlay hidden" onclick="if(event.target===this)closeBookingModal()">
                <div class="modal">
                    <h2>Book a Session</h2>
                    <div id="bookingError" class="alert alert-error hidden"></div>
                    <form id="bookingForm">
                        <div class="form-group"><label>Subject</label><select id="book_subject" class="form-control"></select></div>
                        <div class="form-group"><label>Mode</label><select id="book_mode" class="form-control" onchange="toggleBookingCity()"><option value="online">Online</option><option value="offline">Offline</option></select></div>
                        <div class="form-group" id="bookCityGroup" style="display:none;"><label>City</label><select id="book_city" class="form-control"></select></div>
                        <div class="form-group"><label>Date (YYYY-MM-DD)</label><input type="date" id="book_date" class="form-control" required></div>
                        <div class="form-group"><label>Start Time</label><input type="time" id="book_start" class="form-control" required></div>
                        <div class="form-group"><label>End Time</label><input type="time" id="book_end" class="form-control" required></div>
                        <p style="font-size:13px;color:var(--gray-500);margin-bottom:16px;">Min 60 minutes</p>
                        <div class="modal-actions"><button type="button" class="btn btn-outline" onclick="closeBookingModal()">Cancel</button><button type="submit" class="btn btn-primary">Book Now</button></div>
                    </form>
                </div>
            </div>
            <div id="reviewModal" class="modal-overlay hidden" onclick="if(event.target===this)closeReviewModal()">
                <div class="modal">
                    <h2>Write a Review</h2>
                    <div id="reviewError" class="alert alert-error hidden"></div>
                    <form id="reviewForm">
                        <input type="hidden" id="review_booking_id">
                        <div class="form-group">
                            <label>Booking</label>
                            <select id="review_booking_select" class="form-control" onchange="document.getElementById('review_booking_id').value=this.value"></select>
                        </div>
                        <div class="form-group">
                            <label>Rating</label>
                            <div id="starPicker" class="d-flex gap-1" style="font-size:28px;cursor:pointer;">
                                <span data-star="1">&#9733;</span>
                                <span data-star="2">&#9733;</span>
                                <span data-star="3">&#9733;</span>
                                <span data-star="4">&#9733;</span>
                                <span data-star="5">&#9733;</span>
                            </div>
                            <input type="hidden" id="review_rating" value="0">
                        </div>
                        <div class="form-group">
                            <label>Comment (optional)</label>
                            <textarea id="review_comment" class="form-control" rows="3" placeholder="Share your experience..."></textarea>
                        </div>
                        <div class="modal-actions"><button type="button" class="btn btn-outline" onclick="closeReviewModal()">Cancel</button><button type="submit" class="btn btn-primary">Submit Review</button></div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <nav class="mobile-nav"><a href="dashboard.html"><span>📊</span> Home</a><a href="search.html"><span>🔍</span> Search</a><a href="bookings.html"><span>📅</span> Bookings</a><a href="groups.html"><span>👥</span> Groups</a></nav>
    <script src="../js/api.js?v=5"></script>
    <script src="../js/auth.js?v=5"></script>
    <script src="../js/helpers.js?v=5"></script>
    <script src="../js/theme.js?v=5"></script>
    <script src="js/teacher.js?v=5"></script>
    <script>createThemeToggle("themeToggle");</script>
</body>
</html>
