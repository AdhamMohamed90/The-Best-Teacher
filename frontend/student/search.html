<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Tutors - TutorHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="header">
        <a href="../index.html" class="logo">TutorHub</a>
        <nav><span id="themeToggle"></span><span id="userName"></span><button class="btn btn-outline btn-sm" onclick="logout()">Logout</button></nav>
    </header>
    <div class="dashboard">
        <aside class="sidebar">
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><span class="icon">📊</span> Dashboard</a></li>
                <li><a href="search.html" class="active"><span class="icon">🔍</span> Find Tutors</a></li>
                <li><a href="bookings.html"><span class="icon">📅</span> My Bookings</a></li>
                <li><a href="groups.html"><span class="icon">👥</span> Groups</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <div class="page-header"><h1>Find Tutors</h1></div>
            <div class="filter-bar">
                <select id="filterSubject" class="form-control"><option value="">All Subjects</option><option value="1">Arabic</option><option value="2">English</option><option value="3">Math</option><option value="4">Science</option><option value="5">Social Studies</option></select>
                <select id="filterGrade" class="form-control"><option value="">All Grades</option><option value="1">Primary 1</option><option value="2">Primary 2</option><option value="3">Primary 3</option><option value="4">Primary 4</option><option value="5">Primary 5</option><option value="6">Primary 6</option><option value="7">Secondary 1</option><option value="8">Secondary 2</option><option value="9">Secondary 3</option></select>
                <select id="filterMode" class="form-control"><option value="">All Modes</option><option value="online">Online</option><option value="offline">Offline</option></select>
                <button class="btn btn-primary" onclick="searchTeachers()">Search</button>
            </div>
            <div id="results"></div>
        </main>
    </div>
    <nav class="mobile-nav"><a href="dashboard.html"><span>📊</span> Home</a><a href="search.html" class="active"><span>🔍</span> Search</a><a href="bookings.html"><span>📅</span> Bookings</a><a href="groups.html"><span>👥</span> Groups</a></nav>
    <script src="../js/api.js?v=5"></script>
    <script src="../js/auth.js?v=5"></script>
    <script src="../js/helpers.js?v=5"></script>
    <script src="../js/theme.js?v=5"></script>
    <script src="js/search.js?v=5"></script>
    <script>createThemeToggle("themeToggle");</script>
</body>
</html>
