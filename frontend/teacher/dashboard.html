<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard - TutorHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="header">
        <a href="../index.html" class="logo">TutorHub</a>
        <nav>
            <span id="themeToggle"></span>
            <span id="userName"></span>
            <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
        </nav>
    </header>
    <div class="dashboard">
        <aside class="sidebar">
            <ul class="sidebar-menu">
                <li><a href="dashboard.html" class="active"><span class="icon">📊</span> Dashboard</a></li>
                <li><a href="profile.html"><span class="icon">👤</span> Profile</a></li>
                <li><a href="subjects.html"><span class="icon">📚</span> Subjects</a></li>
                <li><a href="cities.html"><span class="icon">📍</span> Cities</a></li>
                <li><a href="availability.html"><span class="icon">🕐</span> Availability</a></li>
                <li><a href="groups.html"><span class="icon">👥</span> Groups</a></li>
                <li><a href="bookings.html"><span class="icon">📅</span> Bookings</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <div class="page-header"><h1>Dashboard</h1></div>
            <div class="grid grid-4 mb-3" id="stats">
                <div class="stat-card"><div class="stat-label">Subjects</div><div class="stat-value" id="statSubjects">-</div></div>
                <div class="stat-card"><div class="stat-label">Cities</div><div class="stat-value" id="statCities">-</div></div>
                <div class="stat-card"><div class="stat-label">Groups</div><div class="stat-value" id="statGroups">-</div></div>
                <div class="stat-card"><div class="stat-label">Bookings</div><div class="stat-value" id="statBookings">-</div></div>
            </div>
            <div class="grid grid-2 mb-3">
                <div class="stat-card" style="text-align:center;"><div class="stat-label">Average Rating</div><div class="stat-value" id="statRating" style="color:var(--warning);">-</div></div>
                <div class="stat-card" style="text-align:center;"><div class="stat-label">Total Reviews</div><div class="stat-value" id="statReviews">-</div></div>
            </div>
            <div class="card mb-3">
                <div class="card-header"><h2>Recent Bookings</h2><a href="bookings.html" class="btn btn-sm btn-outline">View All</a></div>
                <div id="recentBookings"></div>
            </div>
            <div class="card">
                <div class="card-header"><h2>Recent Reviews</h2></div>
                <div id="recentReviews"></div>
            </div>
        </main>
    </div>
    <nav class="mobile-nav">
        <a href="dashboard.html" class="active"><span>📊</span> Home</a>
        <a href="subjects.html"><span>📚</span> Subjects</a>
        <a href="groups.html"><span>👥</span> Groups</a>
        <a href="bookings.html"><span>📅</span> Bookings</a>
    </nav>
    <script src="../js/api.js?v=5"></script>
    <script src="../js/auth.js?v=5"></script>
    <script src="../js/helpers.js?v=5"></script>
    <script src="../js/theme.js?v=5"></script>
    <script src="js/dashboard.js?v=5"></script>
    <script>createThemeToggle("themeToggle");</script>
</body>
</html>
