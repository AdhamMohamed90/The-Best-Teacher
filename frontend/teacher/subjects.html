<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subjects - TutorHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="header">
        <a href="../index.html" class="logo">TutorHub</a>
        <nav>
            <span id="themeToggle"></span>
            <span id="userName"></span>
            <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
        </nav>
    </header>
    <div class="dashboard">
        <aside class="sidebar">
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><span class="icon">📊</span> Dashboard</a></li>
                <li><a href="profile.html"><span class="icon">👤</span> Profile</a></li>
                <li><a href="subjects.html" class="active"><span class="icon">📚</span> Subjects</a></li>
                <li><a href="cities.html"><span class="icon">📍</span> Cities</a></li>
                <li><a href="availability.html"><span class="icon">🕐</span> Availability</a></li>
                <li><a href="groups.html"><span class="icon">👥</span> Groups</a></li>
                <li><a href="bookings.html"><span class="icon">📅</span> Bookings</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <div class="page-header"><h1>My Subjects</h1><button class="btn btn-primary" onclick="openModal()">+ Add Subject</button></div>
            <div id="subjectsList"></div>
            <div id="modal" class="modal-overlay hidden" onclick="if(event.target===this)closeModal()">
                <div class="modal">
                    <h2 id="modalTitle">Add Subject</h2>
                    <div id="modalError" class="alert alert-error hidden"></div>
                    <form id="subjectForm">
                        <input type="hidden" id="editId">
                        <div class="form-group"><label>Subject</label><select id="subject_id" class="form-control"><option value="1">Arabic</option><option value="2">English</option><option value="3">Math</option><option value="4">Science</option><option value="5">Social Studies</option></select></div>
                        <div class="form-group"><label>Grade</label><select id="grade_id" class="form-control"><option value="1">Primary 1</option><option value="2">Primary 2</option><option value="3">Primary 3</option><option value="4">Primary 4</option><option value="5">Primary 5</option><option value="6">Primary 6</option><option value="7">Secondary 1</option><option value="8">Secondary 2</option><option value="9">Secondary 3</option></select></div>
                        <div class="modal-actions"><button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary" id="formBtn">Save</button></div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <nav class="mobile-nav"><a href="dashboard.html"><span>📊</span> Home</a><a href="subjects.html" class="active"><span>📚</span> Subjects</a><a href="groups.html"><span>👥</span> Groups</a><a href="bookings.html"><span>📅</span> Bookings</a></nav>
    <script src="../js/api.js?v=5"></script>
    <script src="../js/auth.js?v=5"></script>
    <script src="../js/helpers.js?v=5"></script>
    <script src="../js/theme.js?v=5"></script>
    <script src="js/subjects.js?v=5"></script>
    <script>createThemeToggle("themeToggle");</script>
</body>
</html>
