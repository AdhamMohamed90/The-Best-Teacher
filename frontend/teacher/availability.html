<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Availability - TutorHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="header">
        <a href="../index.html" class="logo">TutorHub</a>
        <nav>
            <span id="themeToggle"></span>
            <span id="userName"></span>
            <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
        </nav>
    </header>
    <div class="dashboard">
        <aside class="sidebar">
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><span class="icon">📊</span> Dashboard</a></li>
                <li><a href="profile.html"><span class="icon">👤</span> Profile</a></li>
                <li><a href="subjects.html"><span class="icon">📚</span> Subjects</a></li>
                <li><a href="cities.html"><span class="icon">📍</span> Cities</a></li>
                <li><a href="availability.html" class="active"><span class="icon">🕐</span> Availability</a></li>
                <li><a href="groups.html"><span class="icon">👥</span> Groups</a></li>
                <li><a href="bookings.html"><span class="icon">📅</span> Bookings</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <div class="page-header"><h1>Availability</h1><button class="btn btn-primary" onclick="openModal()">+ Add Slot</button></div>
            <div id="availabilityList"></div>
            <div id="modal" class="modal-overlay hidden" onclick="if(event.target===this)closeModal()">
                <div class="modal">
                    <h2 id="modalTitle">Add Availability</h2>
                    <div id="modalError" class="alert alert-error hidden"></div>
                    <form id="availForm">
                        <input type="hidden" id="editId">
                        <div class="form-group"><label>Day</label><select id="day_of_week" class="form-control"><option>Saturday</option><option>Sunday</option><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option></select></div>
                        <div class="form-group"><label>Start Time</label><input type="time" id="start_time" class="form-control" required></div>
                        <div class="form-group"><label>End Time</label><input type="time" id="end_time" class="form-control" required></div>
                        <p style="font-size:13px;color:var(--gray-500);margin-bottom:16px;">Min 60 minutes</p>
                        <div class="modal-actions"><button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary" id="formBtn">Save</button></div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <nav class="mobile-nav"><a href="dashboard.html"><span>📊</span> Home</a><a href="subjects.html"><span>📚</span> Subjects</a><a href="groups.html"><span>👥</span> Groups</a><a href="bookings.html"><span>📅</span> Bookings</a></nav>
    <script src="../js/api.js?v=5"></script>
    <script src="../js/auth.js?v=5"></script>
    <script src="../js/helpers.js?v=5"></script>
    <script src="../js/theme.js?v=5"></script>
    <script src="js/availability.js?v=5"></script>
    <script>createThemeToggle("themeToggle");</script>
</body>
</html>
