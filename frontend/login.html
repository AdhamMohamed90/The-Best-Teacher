<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TutorHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">TutorHub</a>
        <nav>
            <span id="themeToggle"></span>
            <a href="index.html">Home</a>
            <a href="login.html" class="btn btn-outline btn-sm">Login</a>
            <a href="register.html" class="btn btn-primary btn-sm">Sign Up</a>
        </nav>
    </header>

    <div class="auth-container">
        <div class="auth-card">
            <h1>Welcome Back</h1>
            <p class="subtitle">Login to your account</p>
            <div id="error" class="alert alert-error hidden"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">Login</button>
            </form>
            <p class="link">Don't have an account? <a href="register.html">Sign Up</a></p>
        </div>
    </div>

    <script src="js/api.js?v=5"></script>
    <script src="js/auth.js?v=5"></script>
    <script src="js/helpers.js?v=5"></script>
    <script src="js/theme.js?v=5"></script>
    <script src="js/login.js?v=5"></script>
    <script>createThemeToggle("themeToggle");</script>
</body>
</html>
