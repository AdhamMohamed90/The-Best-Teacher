<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - TutorHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">TutorHub</a>
        <nav>
            <span id="themeToggle"></span>
            <a href="index.html">Home</a>
            <a href="login.html" class="btn btn-outline btn-sm">Login</a>
            <a href="register.html" class="btn btn-primary btn-sm">Sign Up</a>
        </nav>
    </header>

    <div class="auth-container">
        <div class="auth-card">
            <h1>Create Account</h1>
            <p class="subtitle">Join TutorHub today</p>
            <div id="error" class="alert alert-error hidden"></div>

            <div class="role-toggle">
                <button type="button" class="active" id="btnStudent" onclick="setRole('student', this)">Student</button>
                <button type="button" id="btnTeacher" onclick="setRole('teacher', this)">Teacher</button>
            </div>

            <form id="registerForm">
                <input type="hidden" id="role" value="student">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Min 6 characters" required minlength="6">
                </div>
                <div id="teacherFields" class="hidden">
                    <div class="form-group">
                        <label>Teaching Mode</label>
                        <select id="teachingmode" class="form-control">
                            <option value="online">Online</option>
                            <option value="offline">Offline</option>
                            <option value="both">Both</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Bio (optional)</label>
                        <textarea id="bio" class="form-control" rows="3" placeholder="Tell students about yourself"></textarea>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">Create Account</button>
            </form>
            <p class="link">Already have an account? <a href="login.html">Login</a></p>
        </div>
    </div>

    <script src="js/api.js?v=5"></script>
    <script src="js/auth.js?v=5"></script>
    <script src="js/helpers.js?v=5"></script>
    <script src="js/theme.js?v=5"></script>
    <script src="js/register.js?v=5"></script>
    <script>createThemeToggle("themeToggle");</script>
</body>
</html>
